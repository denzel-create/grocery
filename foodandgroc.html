<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food and Groceries</title>
    <link rel="stylesheet" href="foodandgroc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="">
        </div>
        <div class="input">
                <div class="input-box">
                    <i class="fa-solid fa-magnifying-glass"></i>

                     <input type="text" placeholder="Search for products">
                    </div>
                  <select id="sort">
                    <option value="">Sort by</option>
                    <option value="low">Price: Low to high</option>
                    <option value="high">Price: High to low</option>
                    <option value="name">Name A to Z</option>
                  </select>            
    </div>
                  <div class="food">
                    <h1>Food and groceries</h1>
                  </div>
                 
                  <div class="products">
                <div class="image">
                    <img src="images__1rice_-removebg-preview.png" alt="">
                    <h4>Rice</h4>
                    <p>₦60.000</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="image">
                    <div class="inmm">
                        <img src="images__1__garri-removebg-preview.png" alt="">
                    </div>
                    
                    <h4>Garri</h4>
                    <p>₦23,000</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
                <div class="image">
                    <img src="imagesbeans-removebg-preview.png" alt="">
                    <h4>Beans</h4>
                    <p>₦70,000</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
                <div class="image">
                    <div class="inmm">
                        <img src="images-cornremovebg-preview.png" alt="">
                    </div>
                    
                    <h4>Corn</h4>
                    <p>₦55,000</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
            </div>

                  
    </div>
    
</body>
</html>
