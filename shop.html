<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="" height="90px">
        </div>
        <div class="hero">
            <div class="input">
                <div class="input-box">
                    <i class="fa-solid fa-magnifying-glass"></i>

                     <input type="text" placeholder="Search for products">
                    </div>
                  <select id="sort">
                    <option value="">Sort by</option>
                    <option value="low">Price: Low to high</option>
                    <option value="high">Price: High to low</option>
                    <option value="name">Name A to Z</option>
                  </select>            

               
            </div>
            <div class="shop">
                <h1>Shop by categories</h1>
            </div>
            <div class="button">
                <div class="btn">
                <button class="all"> <i class="fa-solid fa-border-all"></i> All</button>
            </div>
            <div class="btn">
                <button class="all"> <img src="IMG_3275.PNG" alt=""> Fruits</button>
            </div>
             <div class="btn">
                <button class="all"> <img src="IMG_3276.PNG" alt=""> Vegetable</button>
            </div>
            <div class="btn">
                <button class="all"> <img src="IMG_3277.PNG" alt=""> Drinks</button>
            </div>
            <div class="btn">
                <button class="all"> <img src="IMG_3278.PNG" alt=""> Groceries</button>
            </div>


            

        </div>

            </div>
            <div class="products">
                <div class="image">
                    <img src="IMG_3269-removebg-preview.png" alt="">
                    <h4>Fresh Apples</h4>
                    <p>₦2,500</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="image">
                    <img src="IMG_3271-removebg-preview.png" alt="">
                    <h4>Fresh Bananas</h4>
                    <p>₦1,500</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
                <div class="image">
                    <img src="IMG_3270-removebg-preview.png" alt="">
                    <h4>Fresh Carrots</h4>
                    <p>₦1,200</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
                <div class="image">
                    <img src="IMG_3272-removebg-preview.png" alt="">
                    <h4>Tomatoes</h4>
                    <p>₦2,000</p>
                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>

                </div>
            </div>
            
    </div>
    
</body>
</html>
