<html lang="en">
<head>

    <title>Drinks and beverages</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

<body>

        </div>
        <div class="input">
                <div class="input-box">
                    <i class="fa-solid fa-magnifying-glass"></i>

                     <input type="text" placeholder="Search for products">
                    </div>
                  <select id="sort">
                    <option value="">Sort by</option>
                    <option value="low">Price: Low to high</option>

                  </select>            
    </div>
                 <div class="drinks">

                 <div class="products">

                    <button class="add-cart">Add to cart <i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="image">
                    <div class="inmm">
                        <img src="images__1_bottled_waterr-removebg-preview.png" alt="">

                </div>
                <div class="image">
                    <img src="download_hollandia_yogurt-removebg-preview.png" alt="">

                </div>
