<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link rel="stylesheet" href="wishlist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

     crossorigin="anonymous"

<body>
    <div class="container">
        <header class="header">
<div class="logo">
     <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="">
</div>

<div class="header-icons">
<i class="fa-solid fa-magnifying-glass"></i>
<i class="fa-solid fa-cart-shopping"></i>
<i class="fa-regular fa-user"></i>
</div>
</header>

<main class="wishlist-container">

<div class="wishlist-heading">
<div class="heading-icon">♥</div>

<div>
<h2>My Wishlist</h2>
<p>Your favourite items, all in one place</p>
</div>
</div>

<section class="wishlist-items">

<!-- Mama's Pride Rice -->
<div class="wishlist-card">

<div class="product-image">
<img src="mamaspriderice.PNG" alt="Mama's Pride Rice">
</div>

<div class="product-details">
<h3>Mama's Pride Rice</h3>
<h2>₦45,000</h2>
<span class="stock">✓ In Stock</span>
</div>

<div class="product-actions">
<button class="remove">♥</button>
<button class="cart-button">🛒 Add to Cart</button>
</div>

</div>


<!-- Golden Beans -->
<div class="wishlist-card">

<div class="product-image">
<img src="golden beans.PNG" alt="Golden Beans">
</div>

<div class="product-details">
<h3>Golden Beans</h3>
<h2>₦28,000</h2>
<span class="stock">✓ In Stock</span>
</div>

<div class="product-actions">
<button class="remove">♥</button>
<button class="cart-button">🛒 Add to Cart</button>
</div>

</div>


<!-- Power Oil -->
<div class="wishlist-card">

<div class="product-image">
<img src="poweroil.PNG" alt="Power Oil">
</div>

<div class="product-details">
<h3>Power Oil</h3>
<h2>₦7,500</h2>
<span class="stock">✓ In Stock</span>
</div>

<div class="product-actions">
<button class="remove">♥</button>
<button class="cart-button">🛒 Add to Cart</button>
</div>

</div>

</section>

<div class="continue-shopping">
<a href="shop.html">🛍 Continue Shopping</a>
</div>

</main>
