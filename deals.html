<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals</title>
    <link rel="stylesheet" href="deals.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="" height="90px">
        </div>
        <div class="hero">
            <div class="shop-now">
                <h1>Get a Discount <br>on Goods</h1>
                <p>When you Sign up!!</p>
                <button class="shop-more">Shop more  <i class="fa-solid fa-arrow-right"></i></button>
               <div class="freshmart"><p>Join <span>Freshmart</span> today and enjoy exclusive offer!</p></div> 
            </div>
        </div>
        <div class="why">
            <div class="section-title">
                <span></span>
                <h1>Why Sign up</h1>
                <span></span>
            </div>
            <div class="card-list">
                <div class="cards">
                <i class="fa-solid fa-tag"></i>
                <h5>Exclusive <br>Discount</h5>
            </div>
            <div class="cards">
                <i class="fa-solid fa-bolt"></i>
                <h5>Faster <br>Checkout</h5>
            </div>
            <div class="cards">
                <i class="fa-solid fa-van-shuttle"></i>
                <h5> priority <br>Delivery</h5>
            </div>

            <div class="cards">
                <i class="fa-solid fa-gift"></i>
                <h5>Special Offers <br>$ More</h5>
            </div>
            </div>
            
        </div>
        <div class="dont">
            <div class="miss-out">
                <h1>Don't Miss Out</h1>
                <p>Sign up now and start saving <br>on all your grocery needs</p>
                <button class="sign-up">Sign up</button>
            </div>
        </div>
    </div>
    
</body>
</html>
