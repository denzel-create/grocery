<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="sign.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        
        <div class="logo">
            <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="" height="90px">
        </div>
        <div class="hero">
            <h1>Create your account</h1>
            <p>Join <span>Freshmart </span> get Fresh groceries deliverd to your door</p>
            <div class="input">
                <h2>Full Name</h2>
                
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Enter Your Name">

                </div>
                
            </div>
            <div class="input">
                <h2>Email</h2>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" placeholder="Enter Your Email">

                </div>
                
                

            </div>
            <div class="input">
                <h2>Phone Number</h2>
                <div class="input-box">
                     <i class="fa-solid fa-phone"></i>
                <input type="text" placeholder="Enter Your Phone number">

                </div>
               

            </div>
            <div class="input">
                <h2>Password</h2>
                <div class="input-box">
                    <i class="fa-solid fa-unlock"></i>
                <input type="text" placeholder="Password">

                </div>
                

            </div>
            <div class="input">
                <h2>Confirm Password</h2>
                <div class="input-box">
                    <i class="fa-solid fa-unlock"></i>
                <input type="text" placeholder="Confirm password">
                    
                </div>
                

            </div>
            <button class="Create-Account">Create Account</button>
           <div class="sign"><p>or sign up with</p></div> 
            <button class="mail"><i class="fa-brands fa-google"></i> Sign up with Google</button>
           <div class="already"><p>Already have an acount ?<span>Log in.</span></p></div> 
        </div>
    </div>
    
</body>
</html>
