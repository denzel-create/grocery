<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address</title>
    <link rel="stylesheet" href="Address.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <!-- Navbar -->

<header class="navbar">

<div class="logo">
   <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="">
</div>

<div class="nav-icons">

<i class="fa-solid fa-magnifying-glass"></i>

<i class="fa-solid fa-cart-shopping"></i>

<i class="fa-regular fa-user"></i>

</div>

</header>


<!-- Main Container -->

<main class="address-container">


<!-- Page Heading -->

<div class="address-heading">

<div class="heading-icon">
<i class="fa-solid fa-location-dot"></i>
</div>

<div>
<h1>My Addresses</h1>
<p>Manage your delivery addresses</p>
</div>

</div>


<!-- Saved Address -->

<div class="saved-address">

<div class="house-image">

<img src="house.png" alt="House">

</div>


<div class="address-info">

<h2>Winner Okafor</h2>

<p>
<i class="fa-solid fa-phone"></i>
0803 123 4567
</p>

<p>
<i class="fa-solid fa-house"></i>
12 Trafalgar Place
</p>

<p>
<i class="fa-solid fa-location-dot"></i>
Fratton, Portsmouth, PO15JJ
</p>

<span class="default-label">
<i class="fa-solid fa-check"></i>
Default Address
</span>

</div>


<div class="address-actions">

<button class="edit-btn">
<i class="fa-solid fa-pen"></i>
Edit
</button>

<button class="delete-btn">
<i class="fa-solid fa-trash"></i>
Delete
</button>

</div>

</div>


<!-- Add New Address Form -->

<section class="add-address">

<div class="form-heading">

<i class="fa-solid fa-location-dot"></i>

<h2>Add New Address</h2>

</div>


<form>


<!-- Full Name and Phone -->

<div class="form-row">

<div class="input-group">

<label>Full Name <span>*</span></label>

<input type="text"
placeholder="Enter your full name">

</div>


<div class="input-group">

<label>Phone Number <span>*</span></label>

<input type="tel"
placeholder="Enter your phone number">

</div>

</div>


<!-- House Number and Street -->

<div class="form-row">

<div class="input-group">

<label>House / Building Number <span>*</span></label>

<input type="text"
placeholder="e.g. 12A">

</div>


<div class="input-group">

<label>Street Address <span>*</span></label>

<input type="text"
placeholder="e.g. Trafalgar Place">

</div>

</div>


<!-- City and State -->

<div class="form-row">

<div class="input-group">

<label>City <span>*</span></label>

<input type="text"
placeholder="e.g. Portsmouth">

</div>


<div class="input-group">

<label>State <span>*</span></label>

<select>

<option value="">Select State</option>

<option>Lagos</option>

<option>Abuja</option>

<option>Ogun</option>

<option>Oyo</option>

<option>Rivers</option>

</select>

</div>

</div>


<!-- Delivery Instructions -->

<div class="input-group">

<label>Delivery Instructions (Optional)</label>

<textarea
placeholder="Any special instructions for delivery..."></textarea>

</div>


<!-- Form Bottom -->

<div class="form-bottom">

<label class="checkbox">

<input type="checkbox" checked>

Set as Default Address

</label>


<button type="submit" class="save-btn">

<i class="fa-solid fa-floppy-disk"></i>

Save Address

</button>

</div>


</form>

</section>


</main>


<!-- Bottom Navigation -->

<footer class="bottom-nav">

<a href="index.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>


<a href="shop.html">

<i class="fa-solid fa-border-all"></i>

<span>Shop</span>

</a>


<a href="order.html">

<i class="fa-solid fa-list"></i>

<span>Orders</span>

</a>


<a href="wishlist.html">

<i class="fa-regular fa-heart"></i>

<span>Wishlist</span>

</a>


<a href="contact.html">

<i class="fa-solid fa-headset"></i>

<span>Support</span>

</a>

</footer>

    </div>

    
</body>
</html>
