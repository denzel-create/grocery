<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" 
     referrerpolicy="no-referrer">

</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="24527535-CBF2-4CD8-B7FC-58B8806052D8.PNG" alt="">
        </div>
        <div class="hero">
            <div class="contact-heading">
              <h1>Contact Us</h1>
                <p>We'd love to hear from you!</p>
              <div class="heading-line"></div>
           </div>
        </div>

        <div class="left-right">
            <div class="left">
                <div class="left-card">
                    <div class="icon"><i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="call"><h2>Email us</h2>
                    <p>Kraftboy6@gmail.com</p></div>
                </div>
                <div class="left-card">
                    <div class="icon"><i class="fa-solid fa-phone"></i></div>
                   <div class="call"><h2>Call us</h2>
                 <p>+2348132628130</p></div> 
                   
                </div>
                <div class="left-card">
                    <div class="icon"><i class="fa-solid fa-location-dot"></i>
                    </div>
                   <div class="call"><h2>Our Location</h2>
                    <p>Sagamu,Ogunstate</p></div> 
                </div>
            </div>
            <div class="right">
                <div class="right-heading">
                    <h1>Send Us A Message</h1>
                    <p>Fill out the form below we'll get back shortly
                    </p>
                    <div class="input">
                        <input type="text" placeholder="Your Name">
                    </div>
                    <div class="input">
                        <input type="text" placeholder="Email Address">
                    </div>
                    <div class="input">
                        <input type="text" placeholder="Your Message">
                    </div>
                    <button class="send-mes"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
                </div>
            </div>
        </div>
        <div class="features">
         <div class="feature">
        <i class="fa-solid fa-shield-halved"></i>
          <span>Secure & Easy Shopping</span>
           </div>

          <div class="feature delivery">
         <i class="fa-solid fa-truck"></i>
         <span>Fast Delivery</span>
           </div>
            </div>  
    </div>
    
</body>
</html>
